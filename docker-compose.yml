services:
  smarttube-playlist:
    # Prebuilt multi-arch image (linux/amd64 + linux/arm64).
    # The path is lowercase because GHCR rejects uppercase image names, even
    # though the GitHub account itself is Alice-Sabrina-Ivy.
    #
    # ┌───────────────────────────────────────────────────────────────────┐
    # │ THIS IS THE BETA BRANCH. The tag below is `:beta`, not `:latest`. │
    # │                                                                   │
    # │ DO NOT MERGE THIS LINE TO main. Every :latest user's fresh install│
    # │ reads main's copy of this file, and pointing them at :beta would  │
    # │ hand a hardware-diagnostics build to people who just want to      │
    # │ watch something. On a beta -> main merge, keep main's `:latest`.  │
    # └───────────────────────────────────────────────────────────────────┘
    image: ghcr.io/alice-sabrina-ivy/smarttube-playlist:beta

    # Building from source instead? Comment out `image:` above, uncomment
    # `build: .` below, and run `docker compose up -d --build` from the repo
    # root. See "Build from source" in the README.
    # build: .

    container_name: smarttube-playlist
    restart: unless-stopped

    ports:
      # host:container. Change only the left number if 38420 is taken.
      #
      # This binds to every interface (0.0.0.0). That is what makes the page
      # reachable from phones on your LAN — and it is fine on a home network.
      # But the service has NO authentication by design, so if this host has
      # any interface reachable from the internet, pin the bind to your LAN
      # address instead, e.g.:
      #   - "192.168.1.50:38420:8000"
      - "38420:8000"

    volumes:
      # Pairing certificate, TV address, and Lounge token persist here.
      # Relative to this file, so `./data` is created next to docker-compose.yml.
      # Back this up and you never have to re-pair.
      - ./data:/data

    environment:
      # ---------------------------------------------------------------
      # All optional. Defaults suit most setups.
      # ---------------------------------------------------------------

      # --- Device diagnostics ---
      # Puts the "Run device self-test" button at the bottom of the page. It
      # takes over the TV for a few minutes, measures what this device
      # actually does, and produces one report to paste back to us.
      #
      # Set it to "0" to hide the button and make the endpoint refuse.
      # Nothing else about the app changes.
      #
      # ┌───────────────────────────────────────────────────────────────────┐
      # │ On a beta -> main merge this becomes "0". Everyone on :latest     │
      # │ should not be handed a button that hijacks their TV.              │
      # │                                                                   │
      # │ app.py's DEFAULT is "0" on BOTH branches and must stay that way.  │
      # │ It used to be "1" here, and that could not survive: if beta       │
      # │ changes a source default and main never touches it, the next      │
      # │ promotion merges CLEAN and main silently inherits it. What makes  │
      # │ the :beta IMAGE default-on is publish.yml passing SELF_TEST=1     │
      # │ (and CHANNEL=beta) as build args, so a tester who pulls :beta     │
      # │ still gets the button with no flags. This line is only for        │
      # │ compose users, whose explicit value overrides the image.          │
      # └───────────────────────────────────────────────────────────────────┘
      SELF_TEST: "1"

      # --- Re-pairing ---
      # Uncomment, restart, and this clears the TV certificate and Lounge
      # token, dropping you back on the setup screen.
      #
      # You can then leave it exactly as it is. It fires ONCE and never again:
      # a container can't unset its own environment variable, so instead the
      # first run writes a marker into /data and every later start sees it and
      # does nothing. Your new pairing is safe.
      #
      # The only reason to comment it back out is if you want to reset a
      # SECOND time later — clearing it deletes the marker and re-arms it.
      # RESET_PAIRING: "1"

      # --- Reverse proxies ---
      # Comma-separated hostnames to accept in the Host header. Only needed if
      # you reach the service through a real DOMAIN NAME; bare IPs, single-label
      # names ("mynas") and .local addresses already work. Requests with any
      # other Host are refused, which is what blocks DNS rebinding.
      # ALLOWED_HOSTS: "tv.example.com"

      # CLIENT_NAME: "SmartTube Playlist"            # name shown on the TV during pairing
      # SMARTTUBE_PACKAGE: "org.smarttube.stable"    # use org.smarttube.beta for the beta build
      # LOG_LEVEL: "INFO"                            # DEBUG when diagnosing a problem
      # RATE_LIMIT_SECONDS: "10"                     # per-IP cool-down between queue submissions

      # --- Waking a sleeping TV ---
      # WAKE_DELAY: "15.0"                           # minimum seconds to wait after POWER before
      #                                              # sending launch intents. Instant-on TVs report
      #                                              # "on" within ~1s while the OS is still booting,
      #                                              # so this is a floor, not a timeout. Raise it if
      #                                              # the TV wakes but the video doesn't start.
      # WAKE_TIMEOUT: "30.0"                         # give up waiting for the TV to report on
      # WAKE_POLL: "0.5"                             # how often to re-check while waking

      # --- Screensaver handling ---
      # SCREENSAVER_PACKAGES: "com.google.android.apps.tv.dreamx,com.google.android.backdrop,com.android.dreams.basic,com.neilturner.aerialviews"
      #                                              # comma-list of packages treated as screensavers.
      #                                              # When one is foreground at add time, we send
      #                                              # SCREENSAVER_DISMISS_KEY to dismiss it (the
      #                                              # screensaver silently drops launch intents).
      # SCREENSAVER_DISMISS_KEY: "HOME"              # keycode that dismisses the screensaver.
      #                                              # HOME is most reliable; BACK also works.
      #                                              # DPAD_CENTER and WAKEUP are NOT supported —
      #                                              # they work via ADB but get silently dropped
      #                                              # by the Android TV Remote protocol layer.

      # --- What the TV shows when the queue runs dry ---
      # IDLE_KEYCODE: "HOME,BACK"                    # comma-list, sent when /api/skip empties
      #                                              # the queue. Default mirrors the physical
      #                                              # remote's HOME-then-BACK to land on the
      #                                              # Google TV ambient/wallpaper screensaver.
      #                                              # Single-key alternatives (most TVs filter
      #                                              # power/sleep keys from the remote protocol):
      #                                              #   "POWER" → display fully off (toggles)
      #                                              #   "HOME"  → just the launcher
      #                                              #   ""      → disabled
      # IDLE_KEYCODE_DELAY: "0.6"                    # seconds between keys in the IDLE_KEYCODE
      #                                              # sequence — TV needs time to react to HOME
      #                                              # before BACK lands on the screensaver.

      # --- Metadata scraping ---
      # DEFAULT_DURATION_S: "600"                    # assumed length when the scrape fails
      # METADATA_TIMEOUT_S: "15.0"                   # YouTube watch-page fetch timeout. The page is
      #                                              # 1.1-1.6 MiB; too low and the scrape fails, which
      #                                              # shows the video ID as the title and assumes a
      #                                              # 10-minute length for the auto-advance timer.
