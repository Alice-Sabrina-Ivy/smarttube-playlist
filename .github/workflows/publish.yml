name: Publish container image

# Builds a multi-arch image and pushes it to GitHub Container Registry.
#
#   push to main   -> ghcr.io/<owner>/smarttube-playlist:main
#   tag v1.2.3     -> :1.2.3, :1.2, :latest
#   pull request   -> build only, never pushed (validates the Dockerfile)
#
# arm64 is built because the main audience runs this on ARM NAS boxes and
# single-board machines. Both arches use prebuilt manylinux wheels for
# cryptography, so the emulated arm64 build stays reasonable.
#
# One-time setup after the first successful run: the GHCR package is created
# private. Open it under your GitHub profile -> Packages -> smarttube-playlist
# -> Package settings -> Change visibility -> Public, or nobody can pull it.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for the arm64 build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on pull requests: forks have no write access to the registry,
      # and PR builds are validation-only.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name for us; GHCR rejects
      # uppercase paths, and GitHub usernames are frequently mixed case.
      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # `latest` is emitted for BOTH a push to the default branch and a
          # release tag. The default-branch case matters: docker-compose.yml
          # pulls :latest, so without it the very first publish would leave
          # every new user's `docker compose up -d` failing with
          # "manifest unknown" until the first vX.Y.Z tag was cut.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
