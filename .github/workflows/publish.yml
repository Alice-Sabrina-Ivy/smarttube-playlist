name: Publish container image

# Builds a multi-arch image and pushes it to GitHub Container Registry.
#
#   push to main   -> ghcr.io/<owner>/smarttube-playlist:main
#   push to beta   -> ghcr.io/<owner>/smarttube-playlist:beta  (hardware beta testing)
#   tag v1.01      -> :1.01, :1, :latest  + a GitHub Release
#   pull request   -> build only, never pushed (validates the Dockerfile)
#
# Versions are MAJOR.MINOR with a zero-padded two-digit minor (v1.00, v1.01,
# v2.00), cut by scripts/release.py. The legacy v1.0 tag predates the scheme.
#
# arm64 is built because the main audience runs this on ARM NAS boxes and
# single-board machines. Both arches use prebuilt manylinux wheels for
# cryptography, so the emulated arm64 build stays reasonable.
#
# One-time setup after the first successful run: the GHCR package is created
# private. Open it under your GitHub profile -> Packages -> smarttube-playlist
# -> Package settings -> Change visibility -> Public, or nobody can pull it.

on:
  push:
    branches: [main, beta]
    tags: ['v*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for the arm64 build)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped on pull requests: forks have no write access to the registry,
      # and PR builds are validation-only.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # metadata-action lowercases the image name for us; GHCR rejects
      # uppercase paths, and GitHub usernames are frequently mixed case.
      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # type=match, not type=semver: our tags are MAJOR.MINOR (v1.01),
          # which is not valid semver, and the semver extractor rejects it.
          # The regex pulls "1.01" and "1" out of a tag like v1.01, giving users
          # both an exact pin and a floating major.
          #
          # `latest` is emitted for BOTH a push to the default branch and a
          # release tag. The default-branch case matters: docker-compose.yml
          # pulls :latest, so without it the very first publish would leave
          # every new user's `docker compose up -d` failing with
          # "manifest unknown" until the first tag was cut.
          tags: |
            type=match,pattern=v(\d+\.\d+),group=1
            type=match,pattern=v(\d+),group=1
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # What makes the `:beta` image a beta image. Deliberately NOT a
          # source-level default that differs between the branches: beta and
          # main ship byte-identical app.py and Dockerfile, so a promotion
          # merge has nothing to carry across by accident. A wrong default
          # here would switch a TV-hijacking button on for every stable user.
          build-args: |
            CHANNEL=${{ github.ref_name == 'beta' && 'beta' || 'stable' }}
            SELF_TEST=${{ github.ref_name == 'beta' && '1' || '0' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs only for tags, and only once the image is actually pushed — a release
  # that points at an image nobody can pull is worse than no release.
  release:
    needs: build-and-push
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the notes can diff against the last tag

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          IMAGE="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"

          # Past releases are never touched: GitHub keeps them all and lists
          # them newest-first, and every old image tag stays pullable.
          {
            echo "## Install or update"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "Or pin the major version with \`${IMAGE}:${VERSION%%.*}\`, or track"
            echo "the newest with \`${IMAGE}:latest\`. Older versions stay available."
            echo
            echo "Already running it? \`docker compose pull && docker compose up -d\`,"
            echo "or if you installed with the one-line \`docker run\` command, see"
            echo "[Updating](https://github.com/Alice-Sabrina-Ivy/smarttube-playlist#changing-a-setting-updating-or-removing-it)."
            echo "Your pairing is kept either way."
          } > notes.md

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes

