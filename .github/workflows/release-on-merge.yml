name: Cut a release when a release PR merges

# Merging a `release/*` PR into main runs scripts/release.py, which bumps
# VERSION, syncs the footer in index.html, commits, tags and pushes.
# publish.yml then builds the image and opens the GitHub release.
#
# Deliberately narrow: it fires ONLY for a merged pull request whose head
# branch starts with `release/`. An ordinary bugfix PR merging to main must
# not mint a version — that is why this is not simply `on: push: main`.
#
# The version being released is READ FROM THE BRANCH NAME, so the branch has
# to be `release/vMAJOR.MINOR` with a zero-padded two-digit minor. That is
# what makes the job safe to re-run; see the note on the version step below.
#
# TWO THINGS WORTH KNOWING BEFORE YOU RELY ON IT
#
# 1. A tag pushed with GITHUB_TOKEN does NOT trigger other workflows. GitHub
#    suppresses that to stop workflows retriggering each other forever, so
#    publish.yml would never see the tag. Rather than require a personal
#    access token, this dispatches publish.yml explicitly on the new tag —
#    publish.yml already accepts workflow_dispatch, and its image tags and
#    release job both key off `github.ref`, which is the tag ref when
#    dispatched that way.
#
# 2. Nothing here needs to know about the Forgejo mirror. It is a PULL
#    mirror that fetches from GitHub on its own schedule, so it follows
#    whatever lands here without being pushed to. It is also read-only:
#    never add a push step for it.
#
# To release without merging a PR, run scripts/release.py locally — it does
# exactly the same thing.

on:
  pull_request:
    types: [closed]
    branches: [main]

# One release at a time. Two merged release PRs a minute apart, or a re-run,
# would otherwise cut versions simultaneously.
#
# That is survivable today, but only by an ordering accident worth not relying
# on: release.py pushes the bump commit BEFORE the tag, so the job that checked
# out first wins and the other has its push refused and dies with its tag still
# only on the runner. Nothing half-finished escapes — but a failed run appears
# in the Actions tab at the exact moment someone is shipping, and they have to
# work out that it was harmless.
#
# `cancel-in-progress: false` is the load-bearing half. Cancelling a release
# mid-push is the one way to produce the half-state the ordering above avoids:
# a bump commit pushed with no tag behind it.
concurrency:
  group: release-on-merge
  cancel-in-progress: false

jobs:
  release:
    # `merged` is the load-bearing half: `closed` fires for abandoned PRs too,
    # and cutting a version from a PR somebody rejected would be worse than
    # not automating this at all.
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # commit the bump, push the tag
      actions: write       # dispatch publish.yml for the new tag

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history AND tags: release.py reads every existing tag to work
          # out the newest version and to refuse a version already taken under
          # the other spelling (1.1 vs 1.01). A shallow clone would make it
          # believe the repo has never been released.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Identify the committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # The version comes from the PR's own branch name, never from bumping
      # whatever main currently says. That is what makes this job safe to
      # re-run.
      #
      # Every side effect of a release happens inside release.py — bump,
      # commit, tag, push both — ahead of the steps below that build the
      # image. So a failure anywhere after that push (a rejected tag push, a
      # transient `gh workflow run` error) leaves the run red with THIS job as
      # the failed one, and the obvious control, "Re-run failed jobs", re-runs
      # it. With `--minor` the re-run read the version the first attempt had
      # just written, bumped it AGAIN, and cut the next version: every guard
      # passed because that tag was genuinely free, so it published an image
      # and a GitHub Release whose body read "No changelog entry yet", took
      # `:latest` and `:1` with it, and stranded the real notes one release
      # back. `release.py --check` could not see it afterwards — VERSION, the
      # footer and the newest tag all agreed.
      #
      # With an explicit `--set`, a re-run asks for the same version and dies
      # on release.py's own "already exists" guard, which is the correct
      # outcome. Pinned by
      # test_the_release_version_comes_from_the_pr_not_from_mains_version_file.
      - name: Work out which version this PR releases
        id: version
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          # release/v1.02 -> 1.02, and release/1.02 too. Anything else is a
          # branch we cannot name a version from, so stop rather than guess.
          VERSION="${HEAD_REF#release/}"
          VERSION="${VERSION#v}"
          # Same canonical form scripts/release.py accepts, so the two cannot
          # disagree about what a version is. MINOR is zero-padded to two
          # digits and carries no surplus zeros: 00, 01, 09, 10, 100 — but not
          # 1 (under-padded, a different image tag) and not 001 or 010
          # (over-padded, a third spelling of a release that already exists).
          # MAJOR takes no leading zero. Validating it HERE rather than leaving
          # it to release.py matters: otherwise the changelog gate below fails
          # first and blames a missing heading, which is the wrong diagnosis
          # and invites someone to commit a section for a version that can
          # never exist. Pinned by tests/test_release.py.
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0[0-9]|[1-9][0-9]+)$'; then
            echo "::error::Cannot read a version from head branch '${HEAD_REF}'."\
                 "Name the branch release/vMAJOR.MINOR with a zero-padded"\
                 "two-digit minor, e.g. release/v1.02."
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

      # Before the tag exists, while there is still something to prevent.
      # publish.yml pulls the release body from a literal `## v<version>`
      # heading in CHANGELOG.md and falls back to "No changelog entry for ...
      # yet." — silently, and the tag and image are immutable by the time
      # anybody reads it.
      - name: Require a changelog entry for it
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! grep -qxF "## ${TAG}" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${TAG}' heading, so the"\
                 "release would publish with an empty body. Add the section"\
                 "to the release PR first."
            exit 1
          fi
          echo "CHANGELOG.md has notes for ${TAG}" >> "$GITHUB_STEP_SUMMARY"

      - name: Cut the release
        id: cut
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python scripts/release.py --set "$VERSION"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Released v${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the image for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.cut.outputs.tag }}"
          # See note 1 above — without this the tag sits there and no image
          # is ever built for it.
          gh workflow run publish.yml --ref "$TAG"
          echo "Dispatched publish.yml for $TAG" >> "$GITHUB_STEP_SUMMARY"

  # Carries the release onto `beta` so device testers run the same app, without
  # anyone maintaining a second pull request in parallel with the first.
  #
  # This is a MERGE, never a fast-forward: beta legitimately carries one commit
  # main does not, and always will. `docker-compose.yml` is the entire
  # divergence — it pins `:beta` instead of `:latest` and sets SELF_TEST="1" —
  # and git preserves beta's copy by itself, because a release that does not
  # touch that file gives the merge nothing to argue about.
  #
  # So the interesting case is the one where a release DOES touch it. Then the
  # merge conflicts, this job fails, and beta is left exactly as it was. That
  # is the correct outcome and the reason there is no `-X ours` here: choosing
  # a side automatically is how beta's `:beta` pin would eventually get
  # replaced by `:latest` and point every tester at the wrong image. Resolve it
  # by hand, keeping beta's tag and SELF_TEST value.
  promote-to-beta:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Identify the committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge main into beta
        id: merge
        run: |
          set -euo pipefail
          git fetch origin main --tags
          VERSION="$(git show origin/main:VERSION)"
          if git merge --no-ff origin/main -m "Merge v${VERSION} into beta

          Automated by release-on-merge.yml so beta tracks releases without a
          second pull request. docker-compose.yml is beta's own and is left
          alone; if a release ever changes it this merge conflicts on purpose."
          then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "::error::main does not merge cleanly into beta. Almost"\
                 "certainly docker-compose.yml, which is beta's only"\
                 "divergence. Resolve by hand, KEEPING beta's :beta image tag"\
                 "and SELF_TEST=1, then push beta. Nothing was pushed."
            exit 1
          fi

      - name: Confirm beta kept its own compose
        run: |
          set -euo pipefail
          # Cheap insurance against the merge silently taking main's side. The
          # cost of getting this wrong is every tester's fresh install pulling
          # :latest and quietly leaving beta behind.
          if ! grep -q "smarttube-playlist:beta" docker-compose.yml; then
            echo "::error::docker-compose.yml no longer pins :beta after the"\
                 "merge. Refusing to push."
            exit 1
          fi
          echo "docker-compose.yml still pins :beta" >> "$GITHUB_STEP_SUMMARY"

      - name: Push beta
        run: git push origin beta

      - name: Build the :beta image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Same GITHUB_TOKEN suppression as the tag push above — without an
          # explicit dispatch, beta would sit on new code with a stale image.
          gh workflow run publish.yml --ref beta
          echo "Dispatched publish.yml for beta" >> "$GITHUB_STEP_SUMMARY"
