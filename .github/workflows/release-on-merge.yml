name: Cut a release when a release PR merges

# Merging a `release/*` PR into main runs scripts/release.py --minor, which
# bumps VERSION, syncs the footer in index.html, commits, tags and pushes.
# publish.yml then builds the image and opens the GitHub release.
#
# Deliberately narrow: it fires ONLY for a merged pull request whose head
# branch starts with `release/`. An ordinary bugfix PR merging to main must
# not mint a version — that is why this is not simply `on: push: main`.
#
# TWO THINGS WORTH KNOWING BEFORE YOU RELY ON IT
#
# 1. A tag pushed with GITHUB_TOKEN does NOT trigger other workflows. GitHub
#    suppresses that to stop workflows retriggering each other forever, so
#    publish.yml would never see the tag. Rather than require a personal
#    access token, this dispatches publish.yml explicitly on the new tag —
#    publish.yml already accepts workflow_dispatch, and its image tags and
#    release job both key off `github.ref`, which is the tag ref when
#    dispatched that way.
#
# 2. It pushes to GITHUB ONLY. The Forgejo mirror is a second push URL
#    configured on the maintainer's local `origin`, which CI knows nothing
#    about. After a release, mirror it from a local clone:
#        git fetch origin && git push origin main --tags
#
# To release without merging a PR, run scripts/release.py locally — it does
# exactly the same thing.

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  release:
    # `merged` is the load-bearing half: `closed` fires for abandoned PRs too,
    # and cutting a version from a PR somebody rejected would be worse than
    # not automating this at all.
    if: >
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # commit the bump, push the tag
      actions: write       # dispatch publish.yml for the new tag

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          # Full history AND tags: release.py reads every existing tag to work
          # out the newest version and to refuse a version already taken under
          # the other spelling (1.1 vs 1.01). A shallow clone would make it
          # believe the repo has never been released.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Identify the committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Cut the release
        id: cut
        run: |
          set -euo pipefail
          python scripts/release.py --minor
          VERSION="$(cat VERSION)"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Released v${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build the image for the new tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.cut.outputs.tag }}"
          # See note 1 above — without this the tag sits there and no image
          # is ever built for it.
          gh workflow run publish.yml --ref "$TAG"
          echo "Dispatched publish.yml for $TAG" >> "$GITHUB_STEP_SUMMARY"

      - name: Remind about the Forgejo mirror
        run: |
          {
            echo ""
            echo "**Mirror still to do.** CI pushed to GitHub only; run this locally:"
            echo ""
            echo '```'
            echo "git fetch origin && git push origin main --tags"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Carries the release onto `beta` so device testers run the same app, without
  # anyone maintaining a second pull request in parallel with the first.
  #
  # This is a MERGE, never a fast-forward: beta legitimately carries one commit
  # main does not, and always will. `docker-compose.yml` is the entire
  # divergence — it pins `:beta` instead of `:latest` and sets SELF_TEST="1" —
  # and git preserves beta's copy by itself, because a release that does not
  # touch that file gives the merge nothing to argue about.
  #
  # So the interesting case is the one where a release DOES touch it. Then the
  # merge conflicts, this job fails, and beta is left exactly as it was. That
  # is the correct outcome and the reason there is no `-X ours` here: choosing
  # a side automatically is how beta's `:beta` pin would eventually get
  # replaced by `:latest` and point every tester at the wrong image. Resolve it
  # by hand, keeping beta's tag and SELF_TEST value.
  promote-to-beta:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out beta
        uses: actions/checkout@v4
        with:
          ref: beta
          fetch-depth: 0

      - name: Identify the committer
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge main into beta
        id: merge
        run: |
          set -euo pipefail
          git fetch origin main --tags
          VERSION="$(git show origin/main:VERSION)"
          if git merge --no-ff origin/main -m "Merge v${VERSION} into beta

          Automated by release-on-merge.yml so beta tracks releases without a
          second pull request. docker-compose.yml is beta's own and is left
          alone; if a release ever changes it this merge conflicts on purpose."
          then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort || true
            echo "::error::main does not merge cleanly into beta. Almost"\
                 "certainly docker-compose.yml, which is beta's only"\
                 "divergence. Resolve by hand, KEEPING beta's :beta image tag"\
                 "and SELF_TEST=1, then push beta. Nothing was pushed."
            exit 1
          fi

      - name: Confirm beta kept its own compose
        run: |
          set -euo pipefail
          # Cheap insurance against the merge silently taking main's side. The
          # cost of getting this wrong is every tester's fresh install pulling
          # :latest and quietly leaving beta behind.
          if ! grep -q "smarttube-playlist:beta" docker-compose.yml; then
            echo "::error::docker-compose.yml no longer pins :beta after the"\
                 "merge. Refusing to push."
            exit 1
          fi
          echo "docker-compose.yml still pins :beta" >> "$GITHUB_STEP_SUMMARY"

      - name: Push beta
        run: git push origin beta

      - name: Build the :beta image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Same GITHUB_TOKEN suppression as the tag push above — without an
          # explicit dispatch, beta would sit on new code with a stale image.
          gh workflow run publish.yml --ref beta
          echo "Dispatched publish.yml for beta" >> "$GITHUB_STEP_SUMMARY"
